[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "bp-k-means"
description = "Boundary Preserving K-Means Algorithm"
dynamic = ["version"]
authors = [
    { name = "Javier Moralejo Piñas", email = "j.moralejo.pinas@gmail.com" },
]
readme = "README.rst"
license = { text = "MIT" }
keywords = ["ml,", "ai,", "clustering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.13"
dependencies = [
    "geopandas",
    "matplotlib",
    "networkx",
    "numpy",
    "osmnx",
    "pandas",
    "pyarrow",
    "requests",
]

[project.urls]
Homepage = "https://github.com/j-moralejo-pinas/bp-k-means"
Changelog = "https://bp-k-means.readthedocs.io/en/latest/CHANGELOG.html"
Source = "https://github.com/j-moralejo-pinas/bp-k-means"
Documentation = "https://bp-k-means.readthedocs.io/"
Tracker = "https://github.com/j-moralejo-pinas/bp-k-means/issues"

[project.scripts]
bp-k-means-benchmark = "bp_k_means.main:main"
bp-k-means-analyze = "bp_k_means.tools.analyze_benchmark:cli"
bp-k-means-download-zenodo = "bp_k_means.tools.download_zenodo_dataset:main"


[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
include = []

[tool.hatch.build.targets.wheel]
packages = ["src/bp_k_means"]
exclude = ["/tests"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pyright[nodejs]",
    "pre-commit",
    "ruff",
    "pydoclint",
    "docformatter",
    "pytest-cov",
    "pyupgrade",
    "py-spy",
]
docs = ["sphinx", "sphinx-autoapi", "sphinx-linkfix", "sphinx-rtd-theme"]
format = ["ruff", "docformatter", "pyupgrade"]
code-quality = ["ruff", "pydoclint", "pyright[nodejs]"]
test = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers"
# norecursedirs = ["build", "dist"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = []

[tool.ruff]
fix = true
unsafe-fixes = true
line-length = 100

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.ruff.lint]
ignore = [
    "S101",    # Use of `assert` for testing purposes
    "COM812",  # Add commas at the end of an iterable
    "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
    "TD003",   # Missing issue link for this TODO
    "FIX001",  # Line contains FIXME, consider resolving the issue
    "FIX002",  # Line contains TODO, consider resolving the issue
    "PLR0913", # Too many arguments in function definition
    "PLR0915", # Too many statements
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed in `**kwargs`
    "ERA001",
    "N803",
    "N806"
]
select = ["ALL"]
exclude = ["docs/*"] # "tests/*"

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
    "D104",  # Package docstrings are intentionally omitted.
]
"tests/*" = [
    "SLF001",  # Private member accessed
    "PLR2004", # Magic value used in comparison
    "INP001",  # File is part of an implicit namespace package.
]
"src/bp_k_means/_version.py" = ["ALL"]

[tool.pydoclint]
style = 'numpy'

[tool.docformatter]
style = 'numpy'
wrap-summaries = 100
wrap-descriptions = 100
pre-summary-newline = true
close-quotes-on-newline = true

[tool.vulture]
# min_confidence = 80
paths = ["src", "tests"]

[tool.bandit]
skips = ["B101"]

[tool.cicd]
workflow = "trunk"
