# Reproduction configuration for the benchmark suite.
# Paths are resolved relative to this file.

[benchmark]
datasets_dir = "../data/datasets"
benchmark_output_dir = "../output/benchmark"
analysis_output_dir = "../output/analysis"
seed = 42
k = [1.5, 2.0, 4.0]
n_inits = [1, 2, 4, 8, 16, 32]
subsample_size = 10
# BP-KMeans benchmark dimensions. Use one value in each list to run a single configuration.
# These lists are combined, so the default covers every ranking/reinitialization combination.
bp_ranking_metrics = ["M_L", "M_C", "M_ERL", "M_RL"]
bp_init_strategies = ["I_LRI", "I_ACL", "I_CRI", "I_ACC"]
bp_init_algorithms = ["KMEANS_PLUS_PLUS"]
run_regular = true
run_hac_strength = false
run_special = true
include_cop_kmeans = false
include_hac = false
skip_existing = true
include_bisecting_kmeans = true
include_bisecting_kmeans_m_rl = true
include_bp_kmeans = true
