# Regular HAC-only benchmark configuration.
# Paths are resolved relative to this file.

[benchmark]
datasets_dir = "../data/datasets"
benchmark_output_dir = "../output/hac"
analysis_output_dir = "../output/analysis"
seed = 42
k = [1.5, 2.0, 4.0]
n_inits = [1]
subsample_size = 10

run_regular = true
run_hac_strength = false
run_special = false

include_cop_kmeans = false
include_hac = true
skip_existing = false
include_bisecting_kmeans = false
include_bisecting_kmeans_m_rl = false
include_bp_kmeans = false
